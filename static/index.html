<!doctype html>
<html>

<head>
  <title>{{ .title }}</title>
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="stylesheet" href="./css/xterm.css" />
  <link rel="stylesheet" href="./css/xterm_customize.css" />
  <link rel="stylesheet" href="./css/kitty.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <div id="terminal"></div>
  <div id="kitty-overlay"></div>
  <!--
    Script load order matters:
    - kitty.js and windows_bridge.js install page-local helpers that inspect the terminal runtime.
    - xterm-addon-unicode11.js must load before gotty.js so the terminal constructor can register
      Unicode 11 width tables when the addon is available.

    gotty.js also exposes internal handles on window for this page's helper scripts:

    - window.__gottyTerminal
      High-level terminal wrapper used by the page.
      Useful methods:
      info() -> { columns, rows }
      output(bytes) -> feed remote output into the terminal/ZMODEM pipeline
      getMessage() -> overlay DOM node
      showMessage(text, timeout)
      showReconnectMessage()
      removeMessage()
      setWindowTitle(title)
      setPreferences({ "font-size", "font-family", "EnableWebGL" })
      sendInput(data)
      onInput(callback)
      onResize(callback)
      deactivate()
      reset()
      close()
      disableStdin()
      enableStdin()
      focus()

    - window.__gottyWebTTY
      Protocol/controller layer that owns the websocket session.
      Useful methods:
      open() -> opens the session and returns a cleanup function
      initializeConnection(arguments, authToken)
      sendInput(data)
      sendPing()
      sendResizeTerminal(columns, rows)
      sendSetEncoding(encoding)
      Properties commonly read by helpers:
      reconnectToken, reconnect, bufSize, disconnected

    - window.__gottyConnection
      Lowest-level websocket wrapper for the active connection.
      Useful methods:
      send(data)
      close()
      isOpen()
      onOpen(callback)
      onReceive(callback)
      onClose(callback)

    - window.__gottyXterm
      The raw xterm.js Terminal instance.
      Useful methods/properties:
      write(data)
      clear()
      reset()
      resize(columns, rows)
      focus()
      blur()
      loadAddon(addon)
      dispose()
      onData(callback)
      onResize(callback)
      options
      unicode.activeVersion

    - window.getTerminalText
      Helper exposed by GoTTYXterm for debugging/copying the full visible buffer
      as plain text.

    - window.Zmodem
      ZMODEM helper namespace exposed by zmodem.js.
      Useful methods are used by the file-transfer addon, especially:
      Browser.send_files(...)
      Browser.save_to_disk(...)

    - window.gotty_kitty_trace
      Boolean trace flag consumed by kitty.js. When true, kitty-specific debug
      logging is enabled.

    - window.touchScrollThreshold
      Mobile touch-scroll threshold in pixels used by kitty.js to convert finger
      movement into synthetic wheel ticks. Default: 24 px. Lower = faster scrolling.

    - alert_advanced(text, asHtml, closeOnClick)
      Page-local modal helper used by the custom UI scripts below.

    - noWinOpenUseFetch()
      Intentional monkey patch for link handling. When enabled, the page stores:
      realConfirm -> original confirm()
      realWinOpen -> original window.open()
      fetchText(url) -> fetch(url).text() helper
      and replaces window.open() with a fetch-and-alert flow for terminal links.

    - Server-injected globals also exist before gotty.js runs:
      gotty_auth_token
      gotty_ws_query_args
      gotty_themes

    These are internal hooks, not a stable public API.
  -->
  <script src="./auth_token.js"></script>
  <script src="./config.js"></script>
  <script src="./js/kitty.js"></script>
  <script src="./js/windows_bridge.js"></script>
  <script src="./js/zmodem.js"></script>
  <script src="./js/xterm-addon-unicode11.js"></script>
  <script src="./js/gotty.js"></script>


<script>
// Page-local helpers below use the same window-scoped hooks created by gotty.js.
// Keep them here so the terminal page can show dialogs and redirect link handling
// without pulling in another framework layer.
// The declarations below intentionally leak a few globals for other scripts on this page:
// alert_advanced, noWinOpenUseFetch, realConfirm, realWinOpen, fetchText, and the
// window.open override installed by noWinOpenUseFetch().

function alert_advanced(text,asHtml,closeOnClick) {
// 若已有舊 dialog，先移除
const old = document.getElementById("alert-advanced-dialog");
if (old) old.remove();

// 建立外層遮罩（透明 + 可點擊關閉）
const overlay = document.createElement("div");
overlay.id = "alert-advanced-dialog";
overlay.style.position = "fixed";
overlay.style.top = "0";
overlay.style.left = "0";
overlay.style.width = "100vw";
overlay.style.height = "100vh";
overlay.style.background = "rgba(0,0,0,0.35)";
overlay.style.backdropFilter = "blur(2px)";
overlay.style.display = "flex";
overlay.style.alignItems = "center";
overlay.style.justifyContent = "center";
overlay.style.zIndex = "99999";

// 建立對話框內容
const box = document.createElement("div");
box.style.maxWidth = "80vw"; // 隨螢幕自適應
box.style.maxHeight = "70vh"; // 可捲動高度
box.style.padding = "2vh 2vw";
box.style.background = "#fff";
box.style.borderRadius = "1.5vh";
box.style.boxShadow = "0 0 2vh rgba(0,0,0,0.3)";
box.style.overflowY = "auto"; // 內容可捲動
//box.style.fontSize = "14px";

box.style.wordBreak = "break-all";
box.style.whiteSpace = "pre-wrap";


if(asHtml)
  box.innerHTML = text ;
else
  box.innerText = text;
  

// 點擊任意區域關閉
overlay.addEventListener("click", () => overlay.remove());

//  Default: no close on clicking content
if(!closeOnClick)
  box.addEventListener("click", (e) => e.stopPropagation());

overlay.appendChild(box);
document.body.appendChild(overlay);
}  //  alert_advanced



function noWinOpenUseFetch(){

let lang = (navigator.language||"")+""

let chi = lang.toLowerCase().includes("zh")

if(chi)
  alert("從現在起，按下終端機內的連結會直接觸發fetch(url)。請小心別誤點可疑連結，重新整理頁面即可回復");
else
  alert("From now on, clicking on links in the terminal directly fetch(url). Please be careful not to click on suspicious links. Refreshing the page reverts this effect.");

if(confirm.toString().includes("native"))
{
  window.realConfirm = confirm ;
  confirm = ()=>true ;
}

if(window.open.toString().includes("native"))
{
  window.realWinOpen=window.open;

  window.fetchText = async (url)=>{
        let txt = await new Promise(res=>{
          fetch(url).then(r=>r.text())
          .then(res).catch(res)
        });
        
        return txt ;
  }

  window.open = (url)=>{
  
    if(url)  
    {
      (async ()=>{

        let txt = await window.fetchText(url);
        if(txt) alert(txt);

        return {location:{}};
      })()

      return null
    }

    return {location:{
      set href(url){
        (async ()=>{

        let txt = await window.fetchText(url);
        if(txt) alert(txt);

        })()
      }
    }}
  }
}

}  // noWinOpenUseFetch


</script>


</body>

</html>
